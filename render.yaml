services:
  - type: web
    name: openid-ocr
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: OPENID_API_URL
        value: https://api.openid.ai
    autoDeploy: true
